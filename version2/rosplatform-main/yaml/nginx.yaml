apiVersion: v1
kind: ConfigMap
metadata:
  namespace: gedge
  name: nginx
data:
  nginx-conf: |

    events {
        worker_connections  1024;
    }

    http {

      map $http_upgrade $connection_upgrade {
          default upgrade;
          '' close;
      }

      upstream websocket {
          server grafana.monitoring.svc:3000;
      }

      server {
          listen 80;
          server_name localhost;

          location / {
            proxy_pass http://webserver.gedge.svc:8000;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-Host $host;
            proxy_set_header X-Forwarded-Server $host;
            proxy_set_header X-Forwarded-Prefix $scheme://$host;
            proxy_set_header X-Forwarded-Prefix $scheme://$host;
          }

          location /d/ {
            proxy_set_header Host $host;
            proxy_pass http://grafana.monitoring.svc:3000;
          }

          location /public/ {
            proxy_set_header Host $host;
            proxy_pass http://grafana.monitoring.svc:3000;
          }

          location /api/ {
            proxy_set_header Host $host;
            proxy_pass http://grafana.monitoring.svc:3000;
          }

          location /api/live/ws {
            proxy_pass http://websocket;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_set_header Host $host;
          }

      }
    
      server {
          listen 81;
          server_name localhost;

          location / {
            proxy_pass http://172.16.11.127:8000;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-Host $host;
            proxy_set_header X-Forwarded-Server $host;
            proxy_set_header X-Forwarded-Prefix $scheme://$host;
            proxy_set_header X-Forwarded-Prefix $scheme://$host;
          }

          location /d/ {
            proxy_set_header Host $host;
            proxy_pass http://grafana.monitoring.svc:3000;
          }

          location /public/ {
            proxy_set_header Host $host;
            proxy_pass http://grafana.monitoring.svc:3000;
          }

          location /api/ {
            proxy_set_header Host $host;
            proxy_pass http://grafana.monitoring.svc:3000;
          }

          location /api/live/ws {
            proxy_pass http://websocket;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_set_header Host $host;
          }

      }
    }
---
apiVersion: v1
kind: Pod
metadata:
  name: nginx
  namespace: gedge
  labels:
    app: nginx
spec:
  restartPolicy: Always
  containers:
  - name: nginx
    image: nginx:latest
    ports:
    - containerPort: 80
    - containerPort: 81
    volumeMounts:
      - name: nginx-conf
        mountPath: /etc/nginx/nginx.conf
        subPath: nginx-conf
  volumes:
  - name: nginx-conf
    configMap:
      name: nginx
---
apiVersion: v1
kind: Service
metadata:
  name: nginx
  namespace: gedge
  labels:
    app: nginx
spec:
  selector:
    app: nginx
  ports:
    - protocol: TCP
      port: 80
      targetPort: 80
      nodePort: 30000
      name: http
    - protocol: TCP
      port: 81
      targetPort: 81
      nodePort: 30001
      name: http-dev
  type: LoadBalancer
