<script>

    var onFilterTextBoxChanged = null;
    var onClusterNameChanged = null;

    var onUserListChanged = null;
    var onActivate_User = null;
    var onSuccess_Update_User = null;
    var onDelete_User = null;
    var onSuccess_Delete_User = null;

    var show_modify_user = null;
    var onWorkspaceListChanged = null;

    function UserDetail() {

    
        const gridOptions = {
            // Row Data: The data to be displayed.
            rowData: [
     
            ],
            // Column Definitions: Defines the columns to be displayed.
            columnDefs: [
                { field: "name", headerName: "Name", width: 150, pinned: "left"},
                { field: "type", headerName: "Type", width: 100, cellRenderer: UserTypeRenderer },
                { field: "email", headerName: "Email", minWidth: 200, flex: 1, cellStyle: {textAlign: "center"} },
                { field: "phone", headerName: "Phone", minWidth: 130, flex: 1, cellStyle: {textAlign: "center"} },
                { field: "workspaces", headerName: "Workspaces", width: 150 , cellStyle: {textAlign: "center"}},
                { field: "status", headerName: "Status", cellRenderer: StatusRenderer, width: 100 },
                { field: "date", headerName: "Date", width: 170, cellStyle: {textAlign: "center"} },
            ],
            pagination: true,
            paginationAutoPageSize: true,
            onRowClicked: function(event) {
                select_user(event.data);
            },
            rowSelection: {
                mode: 'singleRow',
                checkboxes: false,
                headerCheckbox: false,
                enableClickSelection: true,
            }
        };

        // Your Javascript code to create the Data Grid
        const myGridElement = document.querySelector('#user-chart');
        const gridApi = agGrid.createGrid(myGridElement, gridOptions);

        function _onFilterTextBoxChanged() {
            gridApi.setGridOption(
                "quickFilterText",
                document.getElementById("filter-text-box").value,
            );
        }

        function _onUserListChanged(users) {
      
            gridApi.setGridOption("rowData", []);

            users.forEach(user => {
                const name = user.username;
                var type = user.user_type;
                if(type == "admin") {
                    type = "super";
                }else{
                    type = "normal";
                }
                const email = user.email;
                const date = convertUTCToSeoul(user.updated_at);
                const state = user.is_active ? "active" : "inactive";
                const phone = user.phone;
                const workspaces = user.workspaces.join(",");
                //const clusters = user.clusters;


                const newItems = [{ name: name, type: type, email: email, phone: phone, workspaces: workspaces, status: state, date: date }];
                gridApi.applyTransaction({
                    add: newItems
                });
            });
        }

        function _onActivate_User() {
            gridApi.getSelectedRows().forEach(row => {
                update_user(row);
            });
            
        }

        var selected_user = null;

        function select_user(user) {
            selected_user = user;

            select_workspaces(user);

            //select_projects(user);
        }

        function _onSuccess_Update_User(user) {
            gridApi.applyTransaction({
                update: [user]
            });

            selected_user = null;
        }

        function _onDelete_User() {

            if(confirm("Are you sure you want to delete this user?")) {     
                gridApi.getSelectedRows().forEach(row => {
                    delete_user(row);
                });
            }
        }

        function _onSuccess_Delete_User(user) {
            gridApi.applyTransaction({
                remove: [user]
            });
        }

        function select_workspaces(user) {
            
            if(user.workspaces == null || user.workspaces.length == 0) {
                return;
            }

            zfetch("/workspaces/as_user/" + user.name, "GET", null).then(data => {
                onWorkspaceListChanged(data);
            });
        }

        

        function _show_modify_user() {
            var selected_rows = gridApi.getSelectedRows();

            if(selected_rows.length == 0) {
                alert("Please select a user.");
                return;
            }

            var user = selected_rows[0];
            
            $("#id").val(user.name);
            $("#id").attr("readonly", true);
            $("#email").val(user.email);
            $("#phone").val(user.phone);
            //$("#type").val(user.type);

            $("#type").find("option[value='" + user.type + "']").attr("selected", true);
            //$("#workspace").val(user.workspace);
            
            $("#unselected-workspace").empty();
            $("#selected-workspace").empty();


            const workspaces = user.workspaces.split(",");

            workspace_names.forEach(workspace => {
                if(workspaces.includes(workspace)) {
                    $("#selected-workspace").append("<option value='" + workspace + "'>" + workspace + "</option>");
                }else{
                    $("#unselected-workspace").append("<option value='" + workspace + "'>" + workspace + "</option>");
                }
            });

            $("#out_panel").show();

            $("#ok-button").text("Modify");
            $("#ok-button").attr("onclick", "onOkButtonClicked(1)");
        }

    
        onFilterTextBoxChanged = _onFilterTextBoxChanged;
        onUserListChanged = _onUserListChanged;
        onActivate_User  = _onActivate_User;
        onSuccess_Update_User = _onSuccess_Update_User;
        onDelete_User = _onDelete_User;
        onSuccess_Delete_User = _onSuccess_Delete_User;
        show_modify_user = _show_modify_user;
    }


    function WorkspaceDetail() {

        const gridOptions = {
            // Row Data: The data to be displayed.
            rowData: [
               
            ],
            // Column Definitions: Defines the columns to be displayed.
            columnDefs: [
                { field: "name", headerName: "Name", width: 150, pinned: "left"},
                //{ field: "user", headerName: "User", width: 100, cellStyle: {textAlign: "center"}},
                { field: "clusters", headerName: "Clusters", minWidth: 200, flex: 1, cellStyle: {textAlign: "center"} },
                { field: "date", headerName: "Date", width: 170, cellStyle: {textAlign: "center"} },
            ],
            pagination: true,
            paginationAutoPageSize: true,
            onRowClicked: function(event) {
                select_projects(event.data);
            },
            rowSelection: {
                mode: 'singleRow',
                checkboxes: false,
                headerCheckbox: false,
                enableClickSelection: true,
            }
        };

        // Your Javascript code to create the Data Grid
        const myGridElement = document.querySelector('#workspace-chart');
        const gridApi = agGrid.createGrid(myGridElement, gridOptions);

        function _onWorkspaceListChanged(workspaces) {
            gridApi.setGridOption("rowData", []);

            const newItems = [];

            workspaces.forEach(workspace => {
                const name = workspace.name;
                const clusters = workspace.clusters.join(", ");
                const date = convertUTCToSeoul(workspace.updated_at);

                newItems.push({ name: name, clusters: clusters, date: date });
            });

            
            gridApi.applyTransaction({
                add: newItems
            });
        }

        function select_projects(workspace) {

            zfetch("/projects/?workspace_name=" + workspace.name, "GET", null).then(data => {
                onProjectListChanged(data);
            });

        }

        onWorkspaceListChanged = _onWorkspaceListChanged;

    }


    function ProjectDetail() {

        const gridOptions = {
            // Row Data: The data to be displayed.
            rowData: [
            ],
            // Column Definitions: Defines the columns to be displayed.
            columnDefs: [
                { field: "name", headerName: "Name", width: 150, pinned: "left"},
              //  { field: "user", headerName: "User", width: 100, cellStyle: {textAlign: "center"}},
                { field: "clusters", headerName: "Clusters", minWidth: 200, flex: 1, cellStyle: {textAlign: "center"} },
                { field: "date", headerName: "Date", width: 170, cellStyle: {textAlign: "center"} },
            ],
            pagination: true,
            paginationAutoPageSize: true
        };

        // Your Javascript code to create the Data Grid
        const myGridElement = document.querySelector('#project-chart');
        const gridApi = agGrid.createGrid(myGridElement, gridOptions);

        function _onProjectListChanged(projects) {
            gridApi.setGridOption("rowData", []);

            projects.forEach(project => {
                const name = project.name;
                const clusters = project.clusters.join(", ");
                const date = convertUTCToSeoul(project.updated_at);

                const newItems = [{ name: name, clusters: clusters, date: date }];
                gridApi.applyTransaction({
                    add: newItems
                });
            });
        }

        onProjectListChanged = _onProjectListChanged;
    }


   

    UserDetail();
    WorkspaceDetail();
    ProjectDetail();

</script>

<script>
    function onOkButtonClicked(mode) {
        var id = $("#id").val();
        var password = $("#password").val();
        var validate_password = $("#validate-password").val();
        var email = $("#email").val();
        var phone = $("#phone").val();
        var type = $("#type").val();
        //var workspace = $("#workspace").val();

        if(id == "") {
            alert("Please fill in id fields.");
            $("#id").focus();
            return;
        }

        if(password == "" && mode == 0) {
            alert("Please fill in password fields.");
            $("#password").focus();
            return;
        }
        if(validate_password == "" && mode == 0) {
            alert("Please fill in validate password fields.");
            $("#validate-password").focus();
            return;
        }
        if(email == "") {
            alert("Please fill in email fields.");
            $("#email").focus();
            return;
        }

        // 이메일 형식 체크 (간단한 정규식 사용)
        var emailPattern = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
        if(!emailPattern.test(email)) {
            alert("Please enter a valid email address.");
            $("#email").focus();
            return;
        }
        
        if(phone == "") {
            alert("Please fill in phone fields.");
            $("#phone").focus();
            return;
        }
        // 간단한 전화번호 형식 체크 (숫자, 하이픈 허용, 9~15자리)
        var phonePattern = /^[0-9\-]{9,15}$/;
        if(!phonePattern.test(phone)) {
            alert("Please enter a valid phone number (numbers and hyphens only, 9-15 characters).");
            $("#phone").focus();
            return;
        }
        
        if(type == "") {
            alert("Please fill in type fields.");
            $("#type").focus();
            return;
        }

        if (password !== validate_password) {
            alert("Passwords do not match.");
            return;
        }

        //if(workspace == "") {
        //    alert("Please fill in workspace fields.");
        //    $("#workspace").focus();
        //    return;
        //}

        var workspaces = [];
        $("#selected-workspace option").each(function() {
            workspaces.push($(this).val());
        });

        if(workspaces.length == 0) {
            alert("Please select at least one workspace.");
            return;
        }

        var data = {
            username: id,
            password: password,
            email: email,
            phone: phone,
            user_type: type,
            //workspace: workspace,
            workspaces: workspaces
        }

        const url = "/users/";  

        if(mode == 0) {
            zfetch(url, "POST", data).then(data => {
                get_users_info();
                $("#out_panel").hide();
            });
        }else{
            zfetch(url, "PUT", data).then(data => {
                get_users_info();
                $("#out_panel").hide();
            });
        }

    }

    $("#close-button").click(function() {
        $("#out_panel").hide();
    });

    function show_insert_panel() {
        $("#id").val("");
        $("#id").attr("readonly", false);
        $("#password").val("");
        $("#validate-password").val("");
        $("#email").val("");
        $("#phone").val("");
        $("#type").val("user");

       

        //$("#workspace").val("");
        $("#out_panel").show();

        $("#unselected-workspace").empty();
        $("#selected-workspace").empty();

        workspace_names.forEach(workspace => {
            $("#unselected-workspace").append("<option value='" + workspace + "'>" + workspace + "</option>");
        });

        $("#ok-button").text("Create");
        $("#ok-button").attr("onclick", "onOkButtonClicked(0)");
        
    }


    function update_user(user) {

        if(user.name == "admin") {
            alert("Admin user cannot be updated.");
            return;
        }

        var token = localStorage.getItem("access_token");
        var token_type = localStorage.getItem("token_type");
        const url = "/users/" + user.name;

        var status = 0;

        var user_update = {
            username: user.name,
            is_active: user.status == "active" ? false : true
        }

        user.status = user_update.is_active ? "active" : "inactive";
        

        fetch(url, {
            method: "PUT",
            headers: {
                "Authorization": token_type+" " + token,
                "Content-Type": "application/json"
            },
            body: JSON.stringify(user_update)
        })
        .then(response => {
            status = response.status;
            return response.json();
        })
        .then(data => {
            if(status == 422) {
                if(checkProperty(data, "detail")) {
                    data.detail.forEach(error => {
                        alert(error.loc[1] + " : " + error.msg);
                    });
                }
            }else if(status == 200 || status == 201){
               
                onSuccess_Update_User(user);
            }else{
                if(checkProperty(data, "detail")) {
                    alert(data.detail);
                }else{
                    alert("Failed to update user");
                }
            }
        }).catch(error => {
            if(status == 401)
            {
                clear_local_storage();
            }

            alert("Failed to update user");
            return;
        });
    }

    function delete_user(user) {

        if(user.name == "admin") {
            alert("Admin user cannot be updated.");
            return;
        }

        var token = localStorage.getItem("access_token");
        var token_type = localStorage.getItem("token_type");
        const url = "/users/" + user.name;

        var status = 0;

        fetch(url, {
            method: "DELETE",
            headers: {
                "Authorization": token_type+" " + token
            }
        })
        .then(response => {
            status = response.status;
            return response.json();
        })
        .then(data => {
            if(status == 422) { 
                if(checkProperty(data, "detail")) {
                    data.detail.forEach(error => {
                        alert(error.loc[1] + " : " + error.msg);
                    });
                }
            }else if(status == 200 || status == 201){   
                onSuccess_Delete_User(user);
            }else{
                if(checkProperty(data, "detail")) {
                    alert(data.detail);
                }else{
                    alert("Failed to delete user"); 
                }
            }
        }).catch(error => {
            if(status == 401)
            {
                clear_local_storage();  
            }

            alert("Failed to delete user");
            return;
        });
    }


    $("#out_panel").hide();

</script>

    var selected_workspace = $("#selected-workspace option:selected").val();

function onArrowLeftClicked() {
    var selected_workspace = $("#selected-workspace option:selected").val();
