<script>

    var onFilterTextBoxChanged = null;
    var onClusterNameChanged = null;
    

    function ClusterDetail() {

    
        const gridOptions = {
            // Row Data: The data to be displayed.
            rowData: [
    
            ],
            // Column Definitions: Defines the columns to be displayed.
            columnDefs: [
                { field: "name", headerName: "Name", minWidth: 200,  flex: 1},
                { field: "namespace", headerName: "Namespace",minWidth: 100, flex: 1, cellStyle: {textAlign: "center"} },
                { field: "cluster", headerName: "Cluster",minWidth: 100, flex: 1, cellStyle: {textAlign: "center"} },
                { field: "type", headerName: "Service", width: 150, cellStyle: {textAlign: "center"} },
                { field: "externalip", headerName: "External IP", width: 150, cellStyle: {textAlign: "center"} },
                { field: "clusterip", headerName: "Cluster IP", width: 130, cellStyle: {textAlign: "center"} },
                { field: "port", headerName: "Port", width: 130 , cellStyle: {textAlign: "center"}},
                { field: "date", headerName: "Date", width: 170, cellStyle: {textAlign: "center"} },
            ],
            pagination: true,
            paginationAutoPageSize: true
        };

        // Your Javascript code to create the Data Grid
        const myGridElement = document.querySelector('#pod-chart');
        const gridApi = agGrid.createGrid(myGridElement, gridOptions);

        function _onFilterTextBoxChanged() {
            gridApi.setGridOption(
                "quickFilterText",
                document.getElementById("filter-text-box").value,
            );
        }

        function _update_clusters_info(clusters_info) {

            gridApi.setGridOption("rowData", []);

            clusters_info.forEach(cluster => {

                const cluster_name = cluster.cluster_name;
                var external_ip = null;
                cluster.nodes.forEach(node => {

                    if(checkProperty(node.metadata.labels, 'node-role.kubernetes.io/control-plane')) {
                        external_ip = node.status.addresses[0].address;
                        return;
                    }

                });


                cluster.services.forEach(service => {

                    if(service.metadata.namespace == "gedge" || service.metadata.namespace == "gedge-system-scheduler") {
                       
                        const create_timestamp = convertUTCToSeoul(service.metadata.creationTimestamp);
                        const name = service.metadata.name;
                        const namespace = service.metadata.namespace;

        
                        const type = service.spec.type;
                        var clusterip = service.spec.clusterIP;
                        var port = service.spec.ports[0].port + "/" + service.spec.ports[0].nodePort;
                        var externalip = "";

                        if(checkProperty(service.spec.ports[0], "nodePort")) {
                            port = service.spec.ports[0].port + "/" + service.spec.ports[0].nodePort;
                        }else{
                            port = service.spec.ports[0].port;
                        }
                       

                        if(type == "LoadBalancer") {
                            externalip = service.status.loadBalancer.ingress[0].ip;
                        }else if(type == "NodePort") {
                            externalip = external_ip;
                        }

                        const newItems = [{ name: name, namespace: namespace, cluster: cluster_name, type: type, clusterip: clusterip, externalip: externalip, port: port, date: create_timestamp }];

                        const res = gridApi.applyTransaction({
                            add: newItems
                        });
                    }

                });

            });

           
        }

        onFilterTextBoxChanged = _onFilterTextBoxChanged;
        update_clusters_info = _update_clusters_info;
    }

   

    ClusterDetail();

</script>
