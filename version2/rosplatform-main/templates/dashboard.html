<script>

function update_chart() {
    var ctx = document.getElementById('myChart');

    // Get current time
    let now = new Date();
    
    // Create array of 20 timestamps, each 0.5 seconds apart going backwards
    let timestamps = Array.from({length: 20}, (_, i) => {
        let time = new Date(now - (19-i) * 500); // 500ms = 0.5s
        return time.toLocaleTimeString('en-US', { 
            hour12: false,
            minute:'2-digit', 
            second:'2-digit'
        });
    });


    new Chart(ctx, {
    type: 'line',
    data: {
    labels: timestamps,
      datasets: [{
        label: 'PPS',
        data: [1220, 1235, 1245, 1260, 1275, 1290, 1285, 1270, 1255, 1240, 1225, 1210, 1225, 1240, 1255, 1270, 1285, 1290, 1275, 1260],
        borderWidth: 1,
        borderColor: 'rgb(75, 192, 192)',
        backgroundColor: [
        'rgba(75, 192, 192, 0.2)'
        ],
        pointBackgroundColor : 'rgba(75, 192, 192, 0.3)',
      },{
        label: 'BPS',
        data: [3245, 3267, 3289, 3312, 3334, 3356, 3378, 3356, 3334, 3312, 3289, 3267, 3245, 3267, 3289, 3312, 3334, 3356, 3378, 3356],
        borderWidth: 1,
        borderColor: 'rgb(255, 205, 86)',
        backgroundColor: [
        'rgba(2255, 205, 86, 0.2)'
        ],
        pointBackgroundColor : 'rgba(255, 205, 86, 0.3)',
      }]
    },
    options: {
      scales: {
        y: {
          beginAtZero: true,
          min: 0,
          max: 10000,
          grid: {
            color: 'rgba(255,255,255,0.2)',
          },
          ticks: {
            color: 'rgba(255,255,255,1)',
          }
        },
        x: {
          grid: {
            color: 'rgba(255,255,255,0.2',
          },
          ticks: {
            color: 'rgba(255,255,255,1)',
          }
        }
      },
      maintainAspectRatio: false,
    }
  });
}


update_chart();
</script>

<script>


function update_clusters_info(clusters_info) {

    $("#cluster-count").text(clusters_info.length);

}
    
function update_ros_info_data(ros_info) {

    var node_count = 0;
    var topic_count = 0;
    var action_count = 0;
    var service_count = 0;
    var agent_count = 0;
    var publisher_count = 0;
    var subscriber_count = 0;


    for(const ros_info_cluster in ros_info) {
        const ros_info_cluster_data = ros_info[ros_info_cluster];

        node_count += ros_info_cluster_data.node.length;
        topic_count += ros_info_cluster_data.topics.length;
        action_count += ros_info_cluster_data.actions.length;
        service_count += ros_info_cluster_data.services.length;

        publisher_count = ros_info_cluster_data.publishers.length;
        subscriber_count = ros_info_cluster_data.subscribers.length;

        agent_count++;
    }

    $("#ros-info-node-count").text(node_count);
    $("#ros-info-topic-count").text(publisher_count+subscriber_count);
    $("#ros-info-action-count").text(action_count);
    $("#ros-info-service-count").text(service_count);
    $("#bridge-info-agent-count").text(agent_count);
    $("#bridge-info-topic-count").text(publisher_count+subscriber_count);
}

function update_ros_info() {
    get_ros_info().then(data => {
        ros_info = data;
        update_ros_info_data(ros_info);
    });
}


update_ros_info();
get_clusters_info();



    
</script>
