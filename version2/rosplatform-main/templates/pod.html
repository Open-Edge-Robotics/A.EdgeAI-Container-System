<div class="cluster-container">
    <div class="cluster-info-top" style="background-image: url(static/images/bg-t-r.png); background-position: right top; background-repeat: no-repeat;">
        <div class="cluster-header">
            <img src="static/images/pod-m-r.png" width="40px" height="40px" alt="cluster_info" class="cluster-header-icon"> <span class="cluster-header-title">Pod</span>
        </div>
        
        <div style="background: var(--box-inner-color2); width: auto; height: calc(100% - 70px); margin: 10px; padding: 10px;">
            <div class="cluster-detail-sidebar">
                Pod List
            </div>
            <div style="display: flex;  flex-direction: row; margin-bottom: 10px; margin-top: 10px; height: 40px;">
                <div style="width: 300px; height: 40px; background: var(--box-inner-color); 
                    display: flex;  flex-direction: row; align-items: center;">
                    <div style="padding-left: 10px; display: flex; flex-direction: row; align-items: center;"> 
                        <img src="static/images/s_cluster_icon2.png" alt="node"><span>Cluster</span> 
                    </div>
                        
                    <div style="width: 100%; height: 100%; background: var(--box-inner-color);display: flex; flex-direction: row; align-items: center;
                    padding-left: 10px;">
                        <select name="cluster_names" id="cluster_names" style="height: 30px; width: 100%;background: #0F0F0F;outline: 0;border: 0;color: #fff;padding: .5em;"
                          onchange="onClusterNameChanged()" aria-label="Select cluster">
                            <option value="*">All</option>
                            <option value="edge">edge</option>
                            <option value="zento">zento</option>
                        </select>
                    </div>
                </div>
                <div style="width: 400px; height: 40px; background: var(--box-inner-color); 
                    display: flex;  flex-direction: row; align-items: center; padding-left: 10px;">
                    <div style="padding-left: 10px; display: flex; flex-direction: row; align-items: center;padding-right: 10px;"> 
                        <i class="fas fa-search" style="margin-right: 5px;"></i><span>Search</span> 
                    </div>
                    <input type="text" id="filter-text-box" placeholder="Search..." oninput="onFilterTextBoxChanged()" 
                    style="height: 30px; width: 100%;background: #0F0F0F;outline: 0;border: 0;color: #fff;padding: .5em;"/>
                </div>
                
            </div>
            <div id="pod-chart" style="height: calc(100% - 80px); width: auto;">

            </div>
        </div>
        
    </div>
</div>
<script>

    var onFilterTextBoxChanged = null;
    var onClusterNameChanged = null;
    var update_clusters_info = null;

    
    

    function ClusterDetail() {


        let cluster_name = "*";
        
        function doesExternalFilterPass(node) {

            if (cluster_name === "*") {
                return true;
            }else if (node.data.cluster === cluster_name) {

                return true;
            }

            return false;
        }

        function isExternalFilterPresent() {
            return cluster_name !== "*";
        }

    
        const gridOptions = {
            // Row Data: The data to be displayed.
            rowData: [
               
            ],
            // Column Definitions: Defines the columns to be displayed.
            columnDefs: [
                { field: "name", headerName: "Name", minWidth:300, flex: 2, pinned: "left"},
                { field: "user", headerName: "User", width: 100, cellStyle: {textAlign: "center"} },
                { field: "workspace", headerName: "Workspace", width: 120, cellStyle: {textAlign: "center"} },
                { field: "project", headerName: "Project", width: 120 , cellStyle: {textAlign: "center"}},
                { field: "namespace", headerName: "Namespace",width: 200, cellStyle: {textAlign: "center"} },
                { field: "image", headerName: "Image", minWidth: 300, flex: 1 },
                { field: "ip", headerName: "IP", width: 130, cellStyle: {textAlign: "center"} },
                { field: "cluster", headerName: "Cluster", width: 120, cellStyle: {textAlign: "center"} },
                { field: "node", headerName: "Node", width: 120,cellStyle: {textAlign: "center"} },
                { field: "status", headerName: "Status", cellRenderer: StatusRenderer, width: 100 },
                { field: "date", headerName: "Date", width: 170, cellStyle: {textAlign: "center"} },
            ],
            pagination: true,
            paginationAutoPageSize: true,
            isExternalFilterPresent: isExternalFilterPresent,
            doesExternalFilterPass: doesExternalFilterPass
        };

        // Your Javascript code to create the Data Grid
        const myGridElement = document.querySelector('#pod-chart');
        const gridApi = agGrid.createGrid(myGridElement, gridOptions);

        function _onFilterTextBoxChanged() {
            gridApi.setGridOption(
                "quickFilterText",
                document.getElementById("filter-text-box").value,
            );
        }

        function _update_clusters_info(clusters_info) {

            $("#cluster_names").empty();
            $("#cluster_names").append("<option value='*'>All</option>");
            gridApi.setGridOption("rowData", []);

            clusters_info.forEach(cluster => {

                const cluster_name = cluster.cluster_name;

                $("#cluster_names").append("<option value='"+cluster_name+"'>"+cluster_name+"</option>");
                const newItems = [];
                cluster.pods.forEach(pod => {


                    const name = pod.metadata.name;
                    const namespace = pod.metadata.namespace;
                    const image = pod.spec.containers[0].image;
                    const ip = pod.status.podIP;
                    const node = pod.spec.nodeName;
                    const status = pod.status.phase;
                    const date = pod.metadata.creationTimestamp;

                    const create_timestamp = convertUTCToSeoul(pod.metadata.creationTimestamp);

                    const item = { name: name, namespace: namespace, image: image, ip: ip, cluster: cluster_name, node: node, status: status, date: create_timestamp };

                    if(pod.metadata.hasOwnProperty("annotations")) {

                        if(pod.metadata.annotations.hasOwnProperty("username")) {
                            item.user = pod.metadata.annotations.username;
                        }

                        if(pod.metadata.annotations.hasOwnProperty("workspace")) {
                            item.workspace = pod.metadata.annotations.workspace;
                        }

                        if(pod.metadata.annotations.hasOwnProperty("project")) {
                            item.project = pod.metadata.annotations.project;
                        }
                    }

                    newItems.push(item);

                });

                
                   
                const res = gridApi.applyTransaction({
                    add: newItems
                });
                
            }); 
        }

        function _onClusterNameChanged() {
            cluster_name = document.getElementById("cluster_names").value;
            gridApi.onFilterChanged();
        }

        

        onFilterTextBoxChanged = _onFilterTextBoxChanged;

        onClusterNameChanged = _onClusterNameChanged;
        update_clusters_info = _update_clusters_info;
    }

   

    ClusterDetail();

</script>


<script>

    get_clusters_info();
        
</script>
