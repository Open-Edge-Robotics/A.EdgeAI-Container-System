<script>

function get_project_list() {
    get_projects(get_current_user().username, (data) => {
        user_projects = data;
        var options = "";

        for(var i = 0; i < data.length; i++) {
            options += "<option value='" + data[i].name + "'>" + data[i].name + "</option>";
        }        

        $("#project_names").html(options);

        onProjectChanged_yaml();
    });
}

get_project_list();



function addLevel_yaml() {
    var last_level = $(".yaml_level-item").last();
    var names_str = last_level.html().trim();

    if(names_str.length == 0) {
        return;
    }

    var new_level = $("<div class='yaml_level-item'></div>");
    $(".yaml_level-list").append(new_level);

    
}


function removeLevel_yaml() {

    if($(".yaml_level-item").length == 1) {
        return;
    }

    var last_level = $(".yaml_level-item").last();

    var names_str = last_level.html().trim();

    if(names_str.length != 0) {
        var names = names_str.split(",");

        $("#yaml_target-clusters input").each(function() {
            var name = $(this).attr("name");
            var is_checked = $(this).prop("checked");
    
            if(names.includes(name)) {
                $(this).prop("checked", false);
            }
        });
    }

    $(".yaml_level-item").last().remove();

    onPresentClustersChanged_yaml();
}


function onPresentClustersChanged_yaml() {
    var present_clusters = $("#yaml_present-clusters").val();
    
    var present_levels = [];

    $(".yaml_level-item").each(function() {
        var names_str = $(this).html().trim();

        var names = names_str.split(",");

        if(names_str.length == 0) {
            return;
        }

        present_levels.push(names);
    });

    var present_levels_str = JSON.stringify(present_levels);

    if(present_levels.length == 1) {
        present_levels_str = JSON.stringify(present_levels[0]);
    }else if(present_levels.length == 0) {
        present_levels_str = "";
    }

    $("#yaml_present-clusters").val(present_levels_str);
}

function onTargetClusterChanged_yaml(checkbox) {

    var name = $(checkbox).attr("name");

    var last_level = $(".yaml_level-item").last();

    var names_str = last_level.html().trim();

    var names = names_str.split(",");

    if(names_str.length == 0) {
        names = [];
    }

    var is_checked = $(checkbox).prop("checked");

    if(is_checked) {
        names.push(name);
        last_level.html(names.join(","));
    }else{

        $(".yaml_level-item").each(function() {
            var level_names = $(this).html().split(",");
            level_names = level_names.filter(n => n !== name);
            $(this).html(level_names.join(","));
        });
    }

    onPresentClustersChanged_yaml();
}


function onProjectChanged_yaml() {
    var value = $("#project_names").val();
    
    var project = user_projects.find(project => project.name == value);
    if(project) {
        var options = "";
        for(var i = 0; i < project.clusters.length; i++) {
            options += "<option value='" + project.clusters[i] + "'>" + project.clusters[i] + "</option>";
        }
        $("#yaml_target-cluster").html(options);
        $("#yaml_source-cluster").html(options);

        var inputs = "";
        for(var i = 0; i < project.clusters.length; i++) {
            inputs += `<input type='checkbox' id='${project.clusters[i]}' name='${project.clusters[i]}' onchange='onTargetClusterChanged_yaml(this)' /><span class='cluster-item-name_yaml'>${project.clusters[i]}</span>`;
        }
        $("#yaml_target-clusters").html(inputs);

        $("#yaml_source_cluster").html(options);
    }

    onSourceClusterChanged();
}

function onPriorityChanged_yaml() {
    var value = $("#yaml_priority").val();

    $(".form-all-show").hide();

    if(value == "selectedcluster") {
        $(".form-selectedcluster").show();
    } else if(value == "lowlatency") {
        $(".form-lowlatency").show();
        onSourceClusterChanged_yaml();
    } else if(value == "mostrequested") {
        $(".form-mostrequested").show();
    } else if(value == "setcluster") {
        $(".form-setcluster").show();
    }
}


function onSourceClusterChanged_yaml() {
    var value = $("#yaml_source_cluster").val();
    var clusters = current_clusters.filter(cluster => cluster.cluster_name == value);

    if(clusters.length == 0) {
        return;
    }

    var nodes = clusters[0].nodes;

    var options = "";
    for(var i = 0; i < nodes.length; i++) {
        options += `<option value='${nodes[i].metadata.name}'>${nodes[i].metadata.name}</option>`;
    }

    $("#yaml_source_node").html(options);
   
}



onPriorityChanged_yaml();


function getValue_yaml(name)
{
    return $(`#yaml_create_modal ${name}`).val();
}


function send_simple_yaml() {
    var yaml = editor.getValue();

    yaml = yaml.trim();

    if(yaml.length == 0) {
        alert("Please enter a valid yaml");
        return;
    }

    const target_cluster = getValue_yaml("#yaml_target-cluster");
    const source_cluster = getValue_yaml("#yaml_source_cluster");
    const source_node = getValue_yaml("#yaml_source_node");
    const pull_secret = getValue_yaml("#yaml_pull-secret");
    const priority = getValue_yaml("#yaml_priority");
    const present_clusters = getValue_yaml("#yaml_present-clusters");
    const project = getValue_yaml("#project_names");


    if(priority == "setcluster") {
        if(target_cluster.length == 0) {
            alert("Please select a target cluster");
            return;
        }
    }else if(priority == "selectedcluster") {
        if(present_clusters.length == 0) {
            alert("Please select a target cluster");
            return;
        }
    }
    

    const project_ = user_projects.find(project__ => project__.name == project);

    var any_resource = {
        type: "yaml",
        username: get_current_user().username,
        workspace: project_.workspace_name,
        project: project,
        priority: priority,
        present_clusters: present_clusters,
        target_cluster: target_cluster,
        source_cluster: source_cluster,
        source_node: source_node,
        yaml: yaml
    };


    zfetch("/requst_kube_api", "POST", any_resource).then(data => {
        const is_success = error_handler(data);
        if(!is_success) {
            return;
        }

        alert("Yaml created successfully");
    }).catch(error => {
        console.log(error);
    });

}
