<div class="cluster-container">
    <div class="cluster-info-top" style="background-image: url(static/images/bg-t-r.png); background-position: right top; background-repeat: no-repeat;">
        <div class="cluster-header">
            <img src="static/svg/c_cluster.svg" alt="cluster_info" class="cluster-header-icon"> <span class="cluster-header-title">Node</span>
        </div>
        <div class="cluster-info-section">
            <div class="cluster-info-box">
                <img src="static/images/cluster-m-cluster.png" alt="ROS Node Icon">
                <span>Cluster</span>
                <span style="margin-left: auto;">2</span>
            </div>
            <div class="cluster-info-box">
                <img src="static/images/cluster-m-user.png" alt="ROS Node Icon">
                <span>User</span>
                <span style="margin-left: auto;">2</span>
            </div>
            <div class="cluster-info-box">
                <img src="static/images/cluster-m-workspaces.png"  alt="ROS Node Icon">

                <span style="margin-left: auto;">2</span>
            </div>
            <div class="cluster-info-box">
                <img src="static/images/cluster-m-projects.png"  alt="ROS Node Icon">
                <span>Projects</span>
                <span style="margin-left: auto;">2</span>
            </div>
        </div>
        <div class="cluster-main-content">
            <div class="cluster-content-wrapper">
                <div class="cluster-content-title">
                    <span class="cluster-content-title-text">Node</span>
                </div>
                <div class="cluster-content-layout">
                    <div class="cluster-list-panel">
                        <div>
                            <span class="cluster-list-title">List</span>
                        </div>
                        <div style="width: 100%; height: 100%;">
                            <div class="cluster-list-item">
                                <div class="cluster-list-item-icon" style="display: flex; align-items: center; justify-content: center;"><img src="static/images/s_cluster_icon.png" alt="ros"></div>
                                <div class="cluster-list-item-name">Ms-master</div>
                                <div class="cluster-list-item-actions">...</div>
                            </div>
                            <div class="cluster-list-item">
                                <div class="cluster-list-item-icon" style="display: flex; align-items: center; justify-content: center;"><img src="static/images/s_node_icon.png" alt="ros"></div>
                                <div class="cluster-list-item-name"><span style="color: #D30F0F;font-size: 12px;font-weight: 700;">Master Node</span><br><span></span>ms-master</span></div>
                                <div class="cluster-list-item-actions">...</div>
                            </div>

                            <div class="cluster-list-item">
                                <div class="cluster-list-item-icon" style="display: flex; align-items: center; justify-content: center;"><img src="static/images/s_node_icon.png" alt="ros"></div>
                                <div class="cluster-list-item-name"><span style="color: #D30F0F;font-size: 12px;font-weight: 700;">Master Node</span><br><span></span>ms-slave1</span></div>
                                <div class="cluster-list-item-actions">...</div>
                            </div>

                            <div class="cluster-list-item">
                                <div class="cluster-list-item-icon" style="display: flex; align-items: center; justify-content: center;"><img src="static/images/s_node_icon.png" alt="ros"></div>
                                <div class="cluster-list-item-name"><span style="color: #D30F0F;font-size: 12px;font-weight: 700;">Master Node</span><br><span></span>ms-slave2</span></div>
                                <div class="cluster-list-item-actions">...</div>
                            </div>
                            <div class="cluster-list-item">
                                <div class="cluster-list-item-icon" style="display: flex; align-items: center; justify-content: center;"><img src="static/images/s_cluster_icon.png" alt="ros"></div>
                                <div class="cluster-list-item-name">edge-master1</div>
                                <div class="cluster-list-item-actions">...</div>
                            </div>
                        </div>
                    </div>

                    <div class="cluster-detail-panel cluster-detail-layout">
                        <div class="cluster-detail-main">

                            <div class="cluster-detail-content">

                                <div class="cluster-detail-icon-section">
                                    <img src="static/images/cluster-cluster.png" alt="ros">
                                </div>
                                <div class="cluster-detail-info-section">
                                    <div><span class="cluster-detail-title">Node</span></div>
                                    <div><span class="cluster-detail-name">Ms-master</span></div>
                                    <div class="cluster-detail-info-row">
                                        <div class="cluster-detail-info-label">Type</div> 
                                        <div class="cluster-detail-info-value">Master Node</div>
                                    </div>
                                    <div class="cluster-detail-info-row">
                                        <div class="cluster-detail-info-label">InternalIP</div> 
                                        <div class="cluster-detail-info-value">172.16.11.151</div>
                                    </div>
                                    <div class="cluster-detail-info-row">
                                        <div class="cluster-detail-info-label">Compute</div> 
                                        <div class="cluster-detail-info-link">Details</div>
                                    </div>
                                </div>


                            </div>
                            <div class="cluster-detail-stats">
                                <div class="cluster-stat-box">
                                    <div><span class="cluster-stat-number">2</span></div>
                                    <div class="cluster-stat-item">
                                        <img src="static/images/s_pod.png" alt="ros"> 
                                        <span class="cluster-stat-label">Pod</span>
                                    </div>
                                </div>
                                <div class="cluster-stat-box">
                                    <div><span class="cluster-stat-number">10</span></div>
                                    <div class="cluster-stat-item">

                                    </div>
                                </div>
                                <div class="cluster-stat-box" style="background-color: #151515;">
                                   
                                </div>
                                <div class="cluster-stat-box" style="background-color: #151515;">
                                   
                                </div>
                                <div class="cluster-stat-box" style="background-color: #151515;">
                                    
                                </div>
                            </div>
                        </div>
                        <div class="cluster-detail-sidebar" style="display: flex; flex-direction: column; align-items: center; justify-content: center;">
                            <div class="base-timer">
                                <svg class="base-timer__svg" viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
                                  <g class="base-timer__circle" transform="rotate(-90, 50, 50)">
                                    <circle class="base-timer__path-elapsed" cx="50" cy="50" r="45"></circle>
                                    <path
                                      id="gpu-usage"
                                      stroke-dasharray="20 283"
                                      class="base-timer__path-remaining green"
                                      d="
                                        M 50, 50
                                        m -45, 0
                                        a 45,45 0 1,0 90,0
                                        a 45,45 0 1,0 -90,0
                                      "
                                    ></path>
                                  </g>
                                </svg>
                                <span class="base-timer__label">
                                    GPU
                                </span>
                                <span id="gpu-usage-label" class="base-timer__label2">
                                    74.12%
                                </span>
                              </div>
                              <div class="base-timer">
                                <svg class="base-timer__svg" viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
                                  <g class="base-timer__circle" transform="rotate(-90, 50, 50)">
                                    <circle class="base-timer__path-elapsed" cx="50" cy="50" r="45"></circle>
                                    <path
                                      id="cpu-usage"
                                      stroke-dasharray="20 283"
                                      class="base-timer__path-remaining yellow"
                                      d="
                                        M 50, 50
                                        m -45, 0
                                        a 45,45 0 1,0 90,0
                                        a 45,45 0 1,0 -90,0

                                    ></path>
                                  </g>
                                </svg>
                                <span class="base-timer__label" style="color: #AFD30F;">

                              <div class="base-timer">
                                <svg class="base-timer__svg" viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">

                                    <circle class="base-timer__path-elapsed" cx="50" cy="50" r="45"></circle>
                                    <path
                                      id="ram-usage"
                                      stroke-dasharray="20 283"
                                      class="base-timer__path-remaining green"
                                      d="
                                        M 50, 50
                                        m -45, 0
                                        a 45,45 0 1,0 90,0
                                        a 45,45 0 1,0 -90,0

                                <span class="base-timer__label">
